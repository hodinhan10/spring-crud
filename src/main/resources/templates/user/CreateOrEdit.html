<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý người dùng</title>
    <style>
        .form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 50%; 
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>

<body>
    <main>
        <h1 id="title"></h1>
        <form class="form" id="form">
            <div class="field">
                <label for="name">Tên</label>
                <input id="name" name="name" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="field">
                <label for="address">Địa chỉ</label>
                <input id="address" name="address" required>
            </div>
            <div class="actions">
                <button id="submit" type="submit">Lưu người dùng</button>
                <a href="/user">Hủy</a>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="/js/axios-config.js"></script>
    <script src="/js/api.js"></script>
    
    <script>
        const form = document.getElementById("form");
        const [, , , userId] = window.location.pathname.split("/");
        const isEdit = Number(userId);

        document.getElementById("title").textContent = isEdit ? "Cập nhật" : "Thêm";
        document.getElementById("submit").textContent = isEdit ? "Cập nhật" : "Lưu";

        const fetchApi = async () => {
            if (!isEdit) return;

            const { data } = await userApi.detail(userId)
                .catch(() => window.location.href = "/user");
            if (!data) return;

            form.elements.name.value = data.name;
            form.elements.email.value = data.email;
            form.elements.address.value = data.address;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const data = {
                name: form.elements.name.value.trim(),
                email: form.elements.email.value.trim(),
                address: form.elements.address.value.trim(),
            };

            if (isEdit) await userApi.update(userId, data);
            else await userApi.create(data);
            
            window.location.href = "/user";
        });

        fetchApi();
    </script>
</body>
</html>
