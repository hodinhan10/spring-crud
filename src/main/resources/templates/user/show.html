<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Người dùng | Spring Siêu Tốc</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <a class="brand" href="/">SPRING / DASHBOARD</a>
            <nav class="nav-links">
                <a href="/">Dashboard</a>
                <details class="dropdown">
                    <summary>Sản phẩm</summary>
                    <div class="dropdown-menu">
                        <a href="/user">Danh sách người dùng</a>
                        <a href="/user/create">Thêm người dùng</a>
                    </div>
                </details>
            </nav>
        </div>
    </header>
    <main class="container">
        <div class="toolbar">
            <div>
                <div class="eyebrow">Product / User manager</div>
                <h1>Danh sách người dùng</h1>
                <p>Dữ liệu được tải trực tiếp từ REST API.</p>
            </div>
            <a class="button" href="/user/create">+ Thêm người dùng</a>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Email</th>
                        <th>Địa chỉ</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="user-rows"></tbody>
            </table>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="/js/axios-config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const userRows = document.querySelector("#user-rows");

        async function loadUsers() {
            try {
                const { data } = await userApi.list();

                if (!data.length) {
                    userRows.innerHTML = '<tr><td class="empty" colspan="5">Chưa có người dùng.</td></tr>';
                    return;
                }

                userRows.innerHTML = data.map((user) => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${(user.name)}</td>
                        <td>${(user.email)}</td>
                        <td>${(user.address)}</td>
                        <td class="actions">
                            <a class="button secondary" href="/user/${user.id}/edit">Sửa</a>
                            <button class="button danger" data-delete-id="${user.id}">Xóa</button>
                        </td>
                    </tr>
                `).join("");
            } catch (error) {
                console.error("Không thể tải danh sách người dùng.", error);
            }
        }

        userRows.addEventListener("click", async (event) => {
            const button = event.target.closest("[data-delete-id]");
            if (!button) return;

            const id = button.dataset.deleteId;
            if (!window.confirm("Bạn có chắc muốn xóa người dùng này không?")) return;

            button.disabled = true;

            try {
                await userApi.remove(id);
                await loadUsers();
            } catch (error) {
                console.error("Xóa người dùng thất bại.", error);
            }
        });

        loadUsers();
    </script>
</body>
</html>
