<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm người dùng | Spring Siêu Tốc</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <a class="brand" href="/">SPRING / DASHBOARD</a>
            <nav class="nav-links">
                <a href="/user">Người dùng</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <div class="eyebrow">Product / User manager</div>
        <h1>Thêm người dùng</h1>
        <div class="form-card">
            <form id="user-form" data-mode="create">
                <div class="form-grid">
                    <label for="name">
                        Tên
                        <input id="name" name="name" required>
                    </label>
                    <label for="email">
                        Email
                        <input id="email" name="email" type="email" required>
                    </label>
                    <label for="address">
                        Địa chỉ
                        <input id="address" name="address" required>
                    </label>
                </div>
                <div class="form-actions">
                    <button class="button" type="submit">Lưu người dùng</button>
                    <a class="button secondary" href="/user">Hủy</a>
                </div>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="/js/axios-config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const form = document.querySelector("#user-form");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const data = {
                name: form.elements.namedItem("name").value.trim(),
                email: form.elements.namedItem("email").value.trim(),
                address: form.elements.namedItem("address").value.trim(),
            };

            await userApi.create(data).then(() => {
                window.location.href = "/user";
            });

        });
    </script>
</body>
</html>
