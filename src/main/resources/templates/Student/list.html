<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách sinh viên</title>
</head>
<body>
    <main>
        <a href="/">Trang chủ</a> <br>
        <a href="/faculty">Danh sách khoa</a>
        <h1>Danh sách sinh viên</h1>
        <a id="create-student" href="#">+ Thêm sinh viên</a>
        <br><br>

        <form id="search-form">
            <input name="keyword" placeholder="Tên hoặc email">
            <button type="submit">Tìm kiếm</button>
        </form>
        <br>

        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="student-rows"></tbody>
        </table>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="/js/axios-config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const studentRows = document.getElementById("student-rows");
        const searchForm = document.getElementById("search-form");
        const [, , facultyId] = window.location.pathname.split("/");
        document.getElementById("create-student").href = `/faculty/${facultyId}/students/create`;

        const fetchStudents = async (keyword = "") => {
            const { data = [] } = await studentApi.list(facultyId, keyword)
                .catch(() =>  window.location.href = `/faculty`);

            if (!data.length) {
                studentRows.innerHTML = '<tr><td colspan="4">Không có dữ liệu</td></tr>';
                return;
            }

            studentRows.innerHTML = data.map((student) => `
                <tr>
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>
                        <a href="/faculty/${facultyId}/students/edit/${student.id}">Sửa</a>
                        <button onclick="onDeleteStudent(${student.id})">Xóa</button>
                    </td>
                </tr>
            `).join("");
        };

        const onDeleteStudent = async (id) => {
            if (!window.confirm("Bạn có chắc muốn xóa sinh viên này không?")) return;
            await studentApi.remove(facultyId, id);
            await fetchStudents();
        };

        searchForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            await fetchStudents(searchForm.elements.keyword.value);
        });

        fetchStudents();
    </script>
</body>
</html>
